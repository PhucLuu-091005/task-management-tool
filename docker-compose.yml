services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 3

  backend:
    build: ./backend
    restart: unless-stopped
    # The image's CMD is the production gunicorn entrypoint; local dev wants the
    # auto-reloading dev server against the mounted source instead.
    command: ["sh", "-c", "uv run python manage.py migrate --noinput && uv run python manage.py runserver 0.0.0.0:8000"]
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount into container, no need rebuild when change
      - ./backend:/app
      - /app/.venv

  cron:
    build: ./backend
    restart: unless-stopped
    # supercronic must be invoked by absolute path: as PID 1 it re-execs itself
    # via ForkExec (no PATH lookup), so a bare "supercronic" fails with ENOENT.
    command: ["sh", "-c", "uv run python manage.py migrate --noinput && exec /usr/local/bin/supercronic /app/deploy/crontab"]
    env_file:
      - ./backend/.env
    environment:
      - TZ=Asia/Ho_Chi_Minh
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/.venv

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Server-side proxy target (next.config.mjs rewrites /api/*). Must reach the
      # backend over the compose network — inside this container localhost is the
      # frontend itself, so localhost:8000 refuses the connection.
      - BACKEND_INTERNAL_URL=http://backend:8000
      # Browser-facing base (Playwright/direct calls); the app itself uses the proxy.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      # Keep the image's node_modules; the host's may be built for another OS/arch
      - /app/node_modules

volumes:
  postgres_data:

