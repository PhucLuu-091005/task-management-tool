<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="s" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
    <marker id="sa" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="540" rx="16" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="979" height="539" rx="16" fill="none" stroke="#E2E8F0"/>

  <text x="40" y="46" font-size="21" font-weight="700" fill="#0F172A">Vòng đời trạng thái công việc</text>
  <text x="40" y="70" font-size="13" fill="#64748B">Thủ công qua PATCH /status/ · quá hạn do cron flip_overdue_tasks đặt tự động</text>

  <!-- states -->
  <g>
    <rect x="70" y="150" width="180" height="76" rx="12" fill="#F1F5F9" stroke="#94A3B8"/>
    <text x="160" y="185" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">new</text>
    <text x="160" y="207" text-anchor="middle" font-size="11.5" fill="#64748B">Tạo mới</text>
  </g>
  <g>
    <rect x="400" y="150" width="180" height="76" rx="12" fill="#EFF4FF" stroke="#2563EB"/>
    <text x="490" y="185" text-anchor="middle" font-size="16" font-weight="700" fill="#1D4ED8">in_progress</text>
    <text x="490" y="207" text-anchor="middle" font-size="11.5" fill="#3B5BDB">Đang xử lý</text>
  </g>
  <g>
    <rect x="730" y="150" width="180" height="76" rx="12" fill="#ECFDF5" stroke="#059669"/>
    <text x="820" y="185" text-anchor="middle" font-size="16" font-weight="700" fill="#047857">done</text>
    <text x="820" y="207" text-anchor="middle" font-size="11.5" fill="#059669">Hoàn thành</text>
  </g>
  <g>
    <rect x="400" y="340" width="180" height="76" rx="12" fill="#FFFBEB" stroke="#D97706"/>
    <text x="490" y="375" text-anchor="middle" font-size="16" font-weight="700" fill="#B45309">overdue</text>
    <text x="490" y="397" text-anchor="middle" font-size="11.5" fill="#D97706">Quá hạn</text>
  </g>

  <!-- new -> in_progress -->
  <line x1="250" y1="180" x2="398" y2="180" stroke="#334155" stroke-width="1.8" marker-end="url(#s)"/>
  <text x="324" y="170" text-anchor="middle" font-size="11.5" fill="#334155">bắt đầu</text>
  <!-- in_progress -> done -->
  <line x1="580" y1="180" x2="728" y2="180" stroke="#334155" stroke-width="1.8" marker-end="url(#s)"/>
  <text x="654" y="170" text-anchor="middle" font-size="11.5" fill="#334155">hoàn thành</text>
  <!-- in_progress -> new (back) -->
  <path d="M400 205 C 330 230, 260 230, 250 208" fill="none" stroke="#94A3B8" stroke-width="1.3" marker-end="url(#s)"/>
  <text x="324" y="238" text-anchor="middle" font-size="10.5" fill="#94A3B8">mở lại</text>

  <!-- new -> overdue -->
  <path d="M180 226 C 200 300, 340 330, 402 360" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#sa)"/>
  <!-- in_progress -> overdue -->
  <line x1="490" y1="226" x2="490" y2="338" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#sa)"/>
  <text x="505" y="290" font-size="11" fill="#B45309">quá due_date</text>

  <!-- overdue -> in_progress / done (resume) -->
  <path d="M580 372 C 720 360, 760 280, 780 228" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#s)"/>
  <text x="720" y="330" text-anchor="middle" font-size="11" fill="#334155">xử lý tiếp → done / in_progress</text>

  <!-- notes -->
  <g font-size="11.5" fill="#64748B">
    <rect x="40" y="456" width="14" height="3" fill="#334155"/>
    <text x="62" y="462">chuyển thủ công (PATCH /api/tasks/{id}/status/) giữa new · in_progress · done</text>
    <rect x="40" y="478" width="14" height="3" fill="#D97706"/>
    <text x="62" y="484">tự động: cron 00:00 đặt overdue khi due_date &lt; now và status ≠ done — done không bao giờ bị quá hạn</text>
  </g>
  <text x="40" y="510" font-size="11" fill="#94A3B8">is_overdue (thuộc tính đọc tức thời) phản ánh quá hạn ngay cả trước khi cron chạy, nhưng không đổi cột status.</text>
</svg>
